name: Public synthetic regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - name: Get pinned public shader headers
        run: git submodule update --init third_party/spirv-headers third_party/vulkan-headers
      - name: Install pinned Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r tools/requirements-ci.txt
      - name: Run synthetic regression suites
        run: python tools/tests/run_synthetic.py --jobs 2
