name: Native Linux regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config python3-cryptography python3-lz4 python3-zstandard libssl-dev libavcodec-dev libavutil-dev
          sed '/^#/d; /^$/d' tools/linux/build-packages.txt | xargs sudo apt-get install -y --no-install-recommends
      - name: Build and run host contracts
        run: |
          python3 tools/build.py --host-tests --jobs 2 --build-dir build/host-linux
          ctest --test-dir build/host-linux --output-on-failure --no-tests=error
      - name: Run public synthetic regressions
        run: python3 tools/tests/run_synthetic.py --jobs 2
      - name: Compile and link native runtime without game data
        run: |
          python3 tools/tests/link_check_fixture.py --output build/link-check-generated
          python3 tools/build.py --generated-dir build/link-check-generated --build-dir build/link-check --jobs 2
          # The fixture contains empty guest stubs. Never execute or publish it.
      - name: Check production FFmpeg decoder
        run: >-
          python3 tools/tests/ffmpeg_decode_probe.py
          --avcodec "$(pkg-config --variable=libdir libavcodec)/libavcodec.so"
          --avutil "$(pkg-config --variable=libdir libavutil)/libavutil.so"
      - name: Record dependency versions
        if: always()
        run: |
          clang --version
          cmake --version
          pkg-config --modversion openssl libavcodec libavutil
